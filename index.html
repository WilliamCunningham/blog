---
title: Blog
layout: default
---

<h1 class="page-title">Blog</h1>
<p class="page-lede">{{ site.description }}</p>

<ol class="post-list">
  {%- for post in site.posts %}
  <li class="post-item">
    <time class="post-date" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%B %-d, %Y" }}</time>
    <h2 class="post-title"><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
    <p class="post-excerpt">{{ post.excerpt | strip_html | truncatewords: 45 }}</p>
    {% include tags.html tags=post.tags %}
  </li>
  {%- endfor %}
</ol>

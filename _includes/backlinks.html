{% if page.backlinks.size > 0 %}
<hr id='backlink-divider'>
{% endif %}

<section class='mb-5'>
    {% if page.backlinks.size > 0 %}
    <h5 class='mb-4'>Connected pages</h5>
    {% for backlink in page.backlinks %}
      {% if backlink.title != page.title %}
        <div>
          <a class="link-internal" href="{{ backlink.url }}">{{ backlink.title }}</a>
          <p>{{ backlink.description }}
        </div>
      {% endif %}
    {% endfor %}
  {% endif %}
</section>

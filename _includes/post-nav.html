{%- if page.previous or page.next -%}
<nav class="post-nav" aria-label="More posts">
  {%- if page.previous %}
  <a class="prev" href="{{ page.previous.url | relative_url }}"><span>&larr; Older</span>{{ page.previous.title }}</a>
  {%- endif %}
  {%- if page.next %}
  <a class="next" href="{{ page.next.url | relative_url }}"><span>Newer &rarr;</span>{{ page.next.title }}</a>
  {%- endif %}
</nav>
{%- endif -%}
